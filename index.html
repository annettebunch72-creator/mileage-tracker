<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Home</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <!--
      Need a visual blank slate?
      Remove all code in `styles.css`!
    -->
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="script.js"></script>
  </head>
  <body>
    <main>
      <h1>Annette's Mileage Tracker</h1>
      <p>Track mileage, earnings, and expenses for your side gigs.</p>

        <label for="sideGig">Side Gig:</label>
         <select id="sideGig">
          <option value="">Select a side gig</option>
          <option value="Uber">Uber</option>
          <option value="Spark">Spark</option>
        </select>

        <label for="StartMileage">Starting Mileage:</label>
          <input type="number" id=startMileage>

           <button id="startShift">Start Shift</button>

      <p id="shiftStatus"></p>

        <label for="endMileage">Ending Mileage:</label>
         <input type="number" id="endMileage">

        <label for="earnings">Earnings:</label>
         <input type="number" id="earnings" step="0.01">

          <button id="endShift">End Shift</button>

      <p id="shiftSummary"></p>
      <h2>Shift History</hw>
        <button id="exportCSV">Export History to CSV</button>
        <div id="shiftHistory"></div>      

    </main>
  </body>
</html>
